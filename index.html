<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACK JOS | Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="glow blue"></div>
  <div class="glow purple"></div>

  <main class="container">

    <div class="top-label">WELCOME TO THE FUTURE</div>

    <h1>HACK <span>JOS</span></h1>

    <div class="tagline">
      48 HOURS OF INNOVATION
    </div>

    <div class="line"></div>

    <div class="countdown">

      <div class="time-box">
        <div class="number" id="hours">48</div>
        <span class="unit">HOURS</span>
      </div>

      <div class="colon">:</div>

      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <span class="unit">MINUTES</span>
      </div>

      <div class="colon">:</div>

      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <span class="unit">SECONDS</span>
      </div>

    </div>

    <div id="finished">TIME IS UP! 🚀</div>

    <div class="status">
      <span id="statusText">● READY TO LAUNCH</span>
    </div>

    <div class="controls">
      <button class="start" onclick="startTimer()">START</button>
      <button onclick="pauseTimer()">PAUSE</button>
      <button onclick="resetTimer()">RESET</button>
      <button onclick="fullscreen()">FULLSCREEN</button>
    </div>

    <div class="footer">
      BUILD. INNOVATE. CREATE.
    </div>

  </main>

  <script>
    const DURATION = 23 * 45 * 60 * 1000;

    let endTime = null;
    let remaining = DURATION;
    let interval = null;
    let running = false;

    function display() {
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      const s = Math.floor((remaining % 60000) / 1000);

      document.getElementById('hours').textContent =
        String(h).padStart(2, '0');

      document.getElementById('minutes').textContent =
        String(m).padStart(2, '0');

      document.getElementById('seconds').textContent =
        String(s).padStart(2, '0');
    }

    function save() {
      localStorage.setItem('hackjosTimer', JSON.stringify({
        endTime,
        remaining,
        running
      }));
    }

    function update() {
      if (!running) return;

      remaining = Math.max(0, endTime - Date.now());
      display();

      if (remaining <= 0) {
        running = false;
        clearInterval(interval);
        interval = null;
        document.getElementById('statusText').textContent =
          '● EVENT COMPLETED';
        document.getElementById('finished').style.display = 'block';
        save();
      }
    }

    function startTimer() {
      if (running || remaining <= 0) return;

      running = true;
      endTime = Date.now() + remaining;

      document.getElementById('statusText').textContent =
        '● COUNTDOWN IN PROGRESS';

      clearInterval(interval);
      interval = setInterval(update, 250);

      update();
      save();
    }

    function pauseTimer() {
      if (!running) return;

      update();
      if (!running) return;

      running = false;
      clearInterval(interval);
      interval = null;

      document.getElementById('statusText').textContent =
        '● COUNTDOWN PAUSED';

      save();
    }

    function resetTimer() {
      if (!confirm('Reset the countdown to 48 hours?')) return;

      running = false;
      clearInterval(interval);
      interval = null;

      remaining = DURATION;
      endTime = null;

      document.getElementById('statusText').textContent =
        '● READY TO LAUNCH';

      document.getElementById('finished').style.display = 'none';

      display();
      save();
    }

    function fullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // Restore timer after page refresh
    function restore() {
      const saved = localStorage.getItem('hackjosTimer');

      if (saved) {
        const data = JSON.parse(saved);

        remaining = data.remaining;
        endTime = data.endTime;
        running = data.running;

        if (running) {
          update();

          if (running) {
            interval = setInterval(update, 250);
            document.getElementById('statusText').textContent =
              '● COUNTDOWN IN PROGRESS';
          }
        } else if (remaining <= 0) {
          remaining = 0;
          document.getElementById('statusText').textContent =
            '● EVENT COMPLETED';
          document.getElementById('finished').style.display = 'block';
        } else {
          document.getElementById('statusText').textContent =
            '● COUNTDOWN PAUSED';
        }
      }

      display();
    }

    restore();
  </script>

</body>

</html>
