<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACK JOS | Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="glow blue"></div>
  <div class="glow purple"></div>

  <main class="container">

    <div class="top-label">WELCOME TO THE FUTURE</div>

    <h1>HACK <span>JOS</span></h1>

    <div class="tagline">
      48 HOURS OF INNOVATION
    </div>

    <div class="line"></div>

    <div class="countdown">

      <div class="time-box">
        <div class="number" id="hours">48</div>
        <span class="unit">HOURS</span>
      </div>

      <div class="colon">:</div>

      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <span class="unit">MINUTES</span>
      </div>

      <div class="colon">:</div>

      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <span class="unit">SECONDS</span>
      </div>

    </div>

    <div id="finished">TIME IS UP! 🚀</div>

    <div class="status">
      <span id="statusText">● READY TO LAUNCH</span>
    </div>

    <div class="controls">
      <button class="start" onclick="startTimer()">START</button>
      <button onclick="pauseTimer()">PAUSE</button>
      <button onclick="resetTimer()">RESET</button>
      <button onclick="fullscreen()">FULLSCREEN</button>
    </div>

    <div class="footer">
      BUILD. INNOVATE. CREATE.
    </div>

  </main>

  <script src="app.js"></script>

</body>

</html>
